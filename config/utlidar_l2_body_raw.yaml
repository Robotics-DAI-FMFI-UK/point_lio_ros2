/**:
    ros__parameters:
        common:
            lid_topic: "/utlidar/cloud"
            imu_topic: "/go2/body_imu_raw"
            con_frame: false
            con_frame_num: 1
            cut_frame: false
            cut_frame_time_interval: 0.1
            time_lag_imu_to_lidar: 0.0
        preprocess:
            lidar_type: 5
            scan_line: 18
            timestamp_unit: 0
            blind: 0.5
        mapping:
            imu_en: true
            start_in_aggressive_motion: false
            extrinsic_est_en: false
            imu_time_inte: 0.004
            satu_acc: 30.0
            satu_gyro: 35.0
            acc_norm: 9.81
            lidar_meas_cov: 0.01
            acc_cov_output: 500.0
            gyr_cov_output: 1000.0
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            imu_meas_acc_cov: 0.1
            imu_meas_omg_cov: 0.1
            gyr_cov_input: 0.01
            acc_cov_input: 0.1
            plane_thr: 0.1
            match_s: 81.0
            fov_degree: 180.0
            det_range: 100.0
            gravity_align: true
            gravity: [0.0, 0.0, -9.810]
            gravity_init: [0.0, 0.0, -9.810]
            # LiDAR point coordinates -> body IMU coordinates.
            # Assumes cloud axes = L2's internal IMU axes: UNVERIFIED.
            extrinsic_R: [ 0.51985107, -0.81626080,  0.25193884,
                          -0.84237376, -0.53883957, -0.00763960,
                           0.14199052, -0.20825522, -0.96771300 ]
            # LiDAR origin in body IMU coordinates, rough URDF estimate only.
            # Must verify whether URDF radar link denotes factory L2.
            extrinsic_T: [0.31502, 0.0, -0.089145]
        odometry:
            publish_odometry_without_downsample: true
        publish:
            path_en: true
            scan_publish_en: true
            scan_bodyframe_pub_en: false
        pcd_save:
            pcd_save_en: true
            interval: -1
